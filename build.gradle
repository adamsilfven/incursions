plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version='1.0.3'; group='dev.incursions'
base { archivesName='incursions-neoforge-1.21.1' }
java { toolchain.languageVersion=JavaLanguageVersion.of(21); withSourcesJar() }
neoForge {
 version='21.1.259'
 runs { server { server(); gameDirectory=file('run-server'); programArgument '--nogui' } }
 mods { incursions { sourceSet sourceSets.main } }
}
repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4' }
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
sourceSets {
 test { compileClasspath += sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.runtimeClasspath }
 gameTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath }
}
neoForge {
 mods { incursions { sourceSet sourceSets.gameTest } }
 runs { gameTestServer { type='gameTestServer'; gameDirectory=file('run-gametest'); systemProperty 'neoforge.enabledGameTestNamespaces','incursions' } }
}
